name: Build Android Installable APK



on:

  workflow_dispatch:
  


permissions:

  contents: read
  


jobs:

  build-installable-apk:
  
    name: Build installable test APK
    
    runs-on: ubuntu-latest
    
    timeout-minutes: 30
    


    steps:
    
      - name: Checkout source
      
        uses: actions/checkout@v4
        


      - name: Set up pnpm
      
        uses: pnpm/action-setup@v4
        
        with:
        
          version: 9.12.0
          


      - name: Set up Node.js
      
        uses: actions/setup-node@v4
        
        with:
        
          node-version: 22
          
          cache: pnpm
          


      - name: Enable pnpm
      
        run: corepack enable
        


      - name: Install dependencies
      
        run: pnpm install --frozen-lockfile
        


      - name: Set up Java
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: "17"
          


      - name: Generate Android project
      
        run: npx expo prebuild --platform android --non-interactive
        


      - name: Build release APK with embedded JavaScript bundle
      
        working-directory: android
        
        run: |
        
          chmod +x gradlew
          
          ./gradlew app:assembleRelease --no-daemon
          


      - name: Sign installable test APK
      
        working-directory: android
        
        run: |
        
          KEYSTORE_PATH="$RUNNER_TEMP/bookkeeping-test.jks"
          
          ALIGNED_APK="$RUNNER_TEMP/bookkeeping-aligned.apk"
          
          OUTPUT_APK="app/build/outputs/apk/release/bookkeeping-test.apk"
          
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          


          keytool -genkeypair -noprompt \
          
            -keystore "$KEYSTORE_PATH" \
            
            -storepass android \
            
            -keypass android \
            
            -alias bookkeeping-test \
            
            -keyalg RSA \
            
            -keysize 2048 \
            
            -validity 10000 \
            
            -dname "CN=Bookkeeping Test, O=Bookkeeping, C=TW"
            


          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 \
          
            app/build/outputs/apk/release/app-release-unsigned.apk \
            
            "$ALIGNED_APK"
            


          "$BUILD_TOOLS_DIR/apksigner" sign \
          
            --ks "$KEYSTORE_PATH" \
            
            --ks-key-alias bookkeeping-test \
            
            --ks-pass pass:android \
            
            --key-pass pass:android \
            
            --v1-signing-enabled true \
            
            --v2-signing-enabled true \
            
            --v3-signing-enabled true \
            
            --out "$OUTPUT_APK" \
            
            "$ALIGNED_APK"
            


      - name: Verify APK signing
      
        working-directory: android
        
        run: |
        
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --min-sdk-version 24 \
          
            app/build/outputs/apk/release/bookkeeping-test.apk
            


      - name: Upload APK artifact
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: bookkeeping-installable-apk-${{ github.run_number }}
          
          path: android/app/build/outputs/apk/release/bookkeeping-test.apk
          
          if-no-files-found: error
          
          retention-days: 14
          












































































